<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product – Producer Dashboard</title>
  <link rel="stylesheet" href="static/styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="static/supabaseClient.js"></script>
</head>

<body>

<nav class="navbar">
  <div class="logo">Greenfield Hub</div>
  <ul class="nav-links">
    <li><a href="producer_dashboard.html">Dashboard</a></li>
  </ul>
  <button class="logout-btn" onclick="logout()">Logout</button>
</nav>

<section class="login-container">
  <div class="login-box">
    <h2>Add New Product</h2>

    <input type="text" id="productName" placeholder="Product Name">
    <input type="file" id="productImage" accept="image/*">
    <button onclick="addProduct()">Save Product</button>

    <p id="addProductMessage"></p>
  </div>
</section>

<!-- Page JS -->
<script src="static/producer_add_product.js"></script>
<script src="static/logout.js"></script>

</body>
</html>
