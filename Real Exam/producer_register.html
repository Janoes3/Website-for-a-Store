<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Producer Registration – Greenfield Local Hub</title>
  <link rel="stylesheet" href="static/styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="static/supabaseClient.js"></script>
</head>

<body>

<section class="login-container">
  <div class="login-box">
    <h2>Create Producer Account</h2>

    <input type="text" id="producerName" placeholder="Producer Name">
    <input type="email" id="producerEmail" placeholder="Email">
    <input type="text" id="producerPhone" placeholder="Phone Number">
    <input type="text" id="producerAddress" placeholder="Business Address">

    <textarea id="producerDescription" placeholder="Producer Description"></textarea>
    <textarea id="producerMethods" placeholder="Farming Methods"></textarea>

    <input type="password" id="producerPassword" placeholder="Password">

    <button onclick="registerProducer()">Register</button>
    <p id="producerRegisterMessage"></p>

    <p>
      Already registered?
      <a href="producer_login.html">Sign in</a>
    </p>
  </div>
</section>

<script src="static/producer_register.js"></script>
</body>
</html>
