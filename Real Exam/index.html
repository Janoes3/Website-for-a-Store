<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenfield Local Hub</title>

  <!-- Styles -->
  <link rel="stylesheet" href="static/styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="static/supabaseClient.js"></script>
</head>

<body>

<!-- ================= LOGIN POPUP (ALWAYS FIRST) ================= -->
<div id="loginPopup" class="popup-overlay">
  <div class="popup-box">
    <h2>Login</h2>

    <input type="email" id="popupEmail" placeholder="Email">
    <input type="password" id="popupPassword" placeholder="Password">

    <button onclick="popupLogin()">Login</button>
    <p id="popupLoginMessage"></p>

    <p><a href="register.html">Create an account</a></p>
    <p><a href="producer_login.html">Login as producer</a></p>
  </div>
</div>

<!-- ================= SITE CONTENT (LOCKED) ================= -->
<div id="siteContent" style="display:none;">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">Greenfield Hub</div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="order_history.html">My Orders</a></li>
    </ul>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <img src="static/images/farm_home_background.jpg"
         class="hero-img"
         alt="Farm background">

    <div class="hero-overlay">
      <h1>Fresh. Local. Sustainable.</h1>
      <p>Supporting local farmers and producers across Greenfield.</p>
      <a href="products.html" class="hero-button">Shop Now</a>
      <a href="producer_login.html" class="hero-button">Producer Portal</a>
    </div>
  </section>

  <!-- FEATURED PRODUCTS -->
  <section class="products">
    <h2>Featured Products</h2>

    <div class="product-grid" id="featuredProducts">
      <p>Loading products...</p>
    </div>
  </section>

</div>

<!-- ================= PAGE LOGIC ================= -->
<script>
async function initIndex() {
  const { data: { user } } = await supabaseClient.auth.getUser();

  // ✅ FORCE LOGIN FIRST
  if (!user) {
    document.getElementById("loginPopup").style.display = "flex";
    document.getElementById("siteContent").style.display = "none";
    return;
  }

  // ✅ UNLOCK SITE AFTER LOGIN
  document.getElementById("loginPopup").style.display = "none";
  document.getElementById("siteContent").style.display = "block";

  loadFeaturedProducts();
}

async function loadFeaturedProducts() {
  const container = document.getElementById("featuredProducts");

  const { data, error } = await supabaseClient
    .from("tbl_product")
    .select("product_name, productimage")
    .order("productid", { ascending: false })
    .limit(3);

  if (error || !data || data.length === 0) {
    container.innerHTML = "<p>No products available.</p>";
    return;
  }

  container.innerHTML = "";

  data.forEach(product => {
    const card = document.createElement("div");
    card.className = "product-card";
    card.onclick = () => window.location.href = "products.html";

    const img = document.createElement("img");
    img.src = product.productimage;
    img.alt = product.product_name;

    const name = document.createElement("h3");
    name.textContent = product.product_name;

    card.appendChild(img);
    card.appendChild(name);
    container.appendChild(card);
  });
}

window.addEventListener("load", initIndex);
</script>

<!-- REQUIRED SCRIPTS -->
<script src="static/login.js"></script>
<script src="static/logout.js"></script>

</body>
</html>
