<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products – Greenfield Local Hub</title>
  <link rel="stylesheet" href="static/styles.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="static/supabaseClient.js"></script>
</head>

<body>

<!-- NAVIGATION BAR -->
<nav class="navbar">
  <div class="logo">Greenfield Hub</div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
  </ul>

  <span id="welcomeUser"></span>

  <button class="logout-btn" id="logoutBtn" onclick="logout()">
    Logout
  </button>
</nav>

<!-- PRODUCTS SECTION -->
<section class="products">
  <h2>Featured Products</h2>

  <div class="product-grid" id="productList">
    <p>Loading products…</p>
  </div>
</section>

<!-- CART SECTION -->
<section class="cart-section">
  <h2>Your Cart</h2>

  <div id="cart-items">
    <p>Your cart is empty.</p>
  </div>

  <button id="checkoutBtn" onclick="goToCheckout()">
    Proceed to Checkout
  </button>
</section>

<!-- PAGE SCRIPTS -->
<script src="static/products.js"></script>
<script src="static/logout.js"></script>

<!-- CHECKOUT REDIRECT (THIS WAS MISSING BEFORE) -->
<script>
  function goToCheckout() {
    window.location.href = "checkout.html";
  }
</script>

</body>
</html>
